id: 03_temperature_weights
title: Temperature - how aggressively MPPI selects among samples
status: complete
source_section: "1.3"

environment:
  id: Pendulum-v1
  base_config: ../../configs/pendulum.yaml
  initial_observation: [0.0, 1.0, 0.0]
  reuse:
    dynamics: mppi_control.dynamics.pendulum.PendulumDynamics
    cost: mppi_control.costs.pendulum.PendulumCost

study:
  question: How does lambda change selection when trajectories and costs do not change?
  hypothesis: Lower temperature raises maximum weight and lowers ESS.
  independent_variables:
    mppi.temperature: [0.05, 0.1, 0.3, 1.0, 3.0, 10.0, 30.0]
  fixed:
    candidate_batch: frozen
    seed: 7
    mppi.num_samples: 1024
    mppi.horizon: 40
    mppi.noise_sigma: 1.0
    nominal_actions: zero
  pilot_repetitions: 1
  final_repetitions: 1

metrics:
  primary: [maximum_weight, effective_sample_size, normalized_effective_sample_size]
  secondary: []

implementation_needs: []

artifacts:
  plot: plots/temperature_weights.png
