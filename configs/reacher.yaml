seed: 7
device: cpu

environment:
  id: Reacher-v5
  render_mode: human
  episodes: 1
  max_episode_steps: 100

model:
  simulation_timestep: 0.01
  frame_skip: 2
  min_action: -1.0
  max_action: 1.0
  first_link_length: 0.1
  second_link_length: 0.11
  rollout_threads: 8

cost:
  distance_weight: 6.0
  action_weight: 0.07
  joint_velocity_weight: 0.02
  terminal_distance_weight: 11.0

evaluation:
  success_distance: 0.01

mppi:
  horizon: 16
  num_samples: 300
  temperature: 1.0
  noise_sigma: 0.16
  num_iterations: 1
  sampling_correction: true
